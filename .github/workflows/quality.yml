name: Starter Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: starter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate starter structure
        run: python3 scripts/check_project.py
      - name: Run starter tests
        run: python3 -m unittest discover -s tests -v

# This only checks starter documents and paths. Add actual language- and
# platform-specific lint, build and test jobs before any product release.
